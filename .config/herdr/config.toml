[keys]
prefix = "ctrl+j"
split_horizontal = "prefix+-"
split_vertical = "prefix+|"
detach = ["prefix+d", "prefix+q"]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
previous_workspace = ["prefix+shift+h", "prefix+shift+left"]
next_workspace = ["prefix+shift+l", "prefix+shift+right"]

[theme]
name = "rose-pine-dawn"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "catppuccin"

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = false

