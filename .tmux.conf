# rebind prefix to Ctrl+J
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# lower command delay
set -sg escape-time 1

# Enable mouse support
set -g mouse on
set -as terminal-features ',xterm*:mouse'

# Enable extended keys (e.g. modifier for Enter)
set -g extended-keys on
set -g extended-keys-format csi-u

# Let tmux emit clipboard updates via OSC 52
set -s set-clipboard on
# Mosh is picky: force tmux's OSC 52 selector to "c" = clipboard
set -as terminal-overrides ',*:Ms=\E]52;c;%p2%s\007'

# In shells, make C-p/C-n behave like Up/Down history.
# Elsewhere, preserve C-p/C-n for apps like Pi/Neovim.
bind-key -n C-p if-shell -F 'case "#{pane_current_command}" in bash|zsh|fish|sh|dash|ksh) exit 0;; *) exit 1;; esac' 'send-keys Up' 'send-keys C-p'
bind-key -n C-n if-shell -F 'case "#{pane_current_command}" in bash|zsh|fish|sh|dash|ksh) exit 0;; *) exit 1;; esac' 'send-keys Down' 'send-keys C-n'

# start first window and pane at 1, not zero
set -g base-index 1
set -g pane-base-index 1

# Czech keyboard aliases for prefix + number window selection.
# This keeps the default prefix + 0..9 bindings, but also allows using
# the unshifted Czech number-row characters.
bind-key + select-window -t :=1
bind-key ě select-window -t :=2
bind-key š select-window -t :=3
bind-key č select-window -t :=4
bind-key ř select-window -t :=5
bind-key ž select-window -t :=6
bind-key ý select-window -t :=7
bind-key á select-window -t :=8
bind-key í select-window -t :=9
bind-key é select-window -t :=0

# better mnemonics for splitting panes!
bind | split-window -h
bind - split-window -v

# vim / xmonad style bindings for pane movement
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# shift-movement keys will resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# bind r to reloading the config file
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config file."

# turn on <t_co> color support in tmux
set -g default-terminal "tmux-256color"

# Highlight the active window
setw -g window-status-current-style bright

# navigate using vim-style keys
setw -g mode-keys vi

# Drag to copy to the clipboard (tmux + system)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# DESIGN TWEAKS ------------------------------------------------

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=yellow bold'

# panes
set -g pane-border-style 'fg=gray'
set -g pane-active-border-style 'fg=black'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=red bg=default'
set -g window-status-separator ' '

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=default'
set -g status-right '#[fg=black,bg=gray] %Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=white bg=default'
setw -g window-status-current-format '#[fg=white,bg=black] #I #W #F '

setw -g window-status-style 'fg=black bg=default'
setw -g window-status-format '#[fg=black,bg=#{?window_bell_flag,red,#{?window_activity_flag,yellow,gray}}] #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-activity-style 'fg=black bg=default'
setw -g window-status-bell-style 'fg=white bg=default bold'
setw -g window-status-last-style 'fg=black bg=default'

# messages
set -g message-style 'fg=black bg=gray bold'
